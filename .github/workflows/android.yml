# This is a basic workflow to help you get started with Actions

name: Android Build CI

# Controls when the workflow will run
on: [push, pull_request]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.0
      # Runs a set of commands using the runners shell
      - name: script run lime haha
        run: |
          haxelib git lime https://github.com/kittycathy233/lime --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib git flixel https://github.com/kittycathy233/flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-addons
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install flixel-addons --quiet
          haxelib git faxe https://github.com/uhrobots/faxe--quiet
          haxelib git polymod https://github.com/MasterEric/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib git extension-webm https://github.com/KadeDev/extension-webm --quiet
          haxelib run lime rebuild extension-webm android --quiet
          haxelib git linc_luajit https://github.com/kittycathy233/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit --quiet
          haxelib install actuate 
          haxelib list
    
          - name: config android ig
             run: |
                haxelib run lime config ANDROID_SDK $ANDROID_HOME
                haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
                 haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
                 haxelib run lime config ANDROID_SETUP true
                 haxelib run lime build android
          
      - uses: actions/upload-artifact@v4
        with:
          name: android Build
          path: 'export/release/android/bin/app/build/outputs/apk/release/*.apk'
